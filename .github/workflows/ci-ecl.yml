# ECL, on macOS arm64.
#
# A separate workflow rather than a leg of ci-macos.yml, and deliberately so.
# That file's matrix varies the runner; this varies the *implementation*, needs
# a Lisp built from source, and has one known failure. Folding it in would make
# the single badge mean "both, mostly", and the whole point of that badge is
# that it means "both pass".
#
# What this can and cannot prove.  Everything ci-macos.yml says about the
# headless runner applies here too: no window server, so the gui suite skips
# itself.  Beyond that, one test is skipped on ECL for a real reason -- a block
# invoked on a libdispatch worker never returns -- and iOS is not exercised at
# all.  No hosted runner has a cross-compiled ECL and building one is a
# twenty-minute job, so the iOS half of this backend stays a manual check on a
# device.  A green badge here means ECL on macOS, and nothing about a phone.

name: ECL

on:
  push:
    branches: [master, main]
  pull_request:
  # This one is hand-runnable.  The sibling workflows are not, because they
  # only ever need to answer "does this commit pass"; this one also has to
  # answer "did the ECL build step work yet", and iterating on that through
  # empty commits is a poor way to spend a morning.
  workflow_dispatch:

jobs:
  test:
    name: ecl · macos-latest (arm64)
    runs-on: macos-latest
    # The revision lives here, not on the two steps that use it: a cache key
    # and the checkout that fills the cache must never disagree, and the surest
    # way to keep them honest is to give them one place to read it from.
    #
    # A commit, never a branch.  A branch name in a cache key is a key that
    # stops tracking what it names the moment the branch moves, and the cache
    # would then hand back a binary built from something else entirely.
    env:
      ECL_REPOSITORY: https://github.com/lispnik/ecl.git
      ECL_REVISION: aef1276d7
    # Building ECL is the long pole at roughly six minutes cold, and nothing
    # after it takes more than five.  Same reasoning as the sibling workflow:
    # loose enough never to fire on a slow runner, tight enough that a hung
    # test is diagnosable rather than a runner that "lost communication".
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      # ---------------------------------------------------------------
      # A stock ECL cannot run this library at all, and the reason is not iOS.
      #
      #     (si:find-foreign-symbol "strlen" :default :pointer-void 0)
      #     => Could not load foreign symbol "strlen" from module :DEFAULT
      #
      # Not objc_getClass -- strlen.  ecl_library_symbol calls dlsym(0, ...)
      # for the :default module, and on Darwin a null handle is not the global
      # scope; RTLD_DEFAULT is (void *)-2.  CFFI's ECL backend resolves foreign
      # functions by name, so on a stock build CFFI resolves nothing.
      #
      # So this builds ECL rather than installing one, from lispnik/ecl's
      # objc-develop: upstream develop plus fixes on two more branches there,
      # each for sending upstream.  RTLD_DEFAULT (above); FFI:CALLBACK
      # returning a closure's entry point rather than its writable record,
      # without which a dynamic callback jumps into the heap on arm64 macOS and
      # iOS, and importing the thread a callback arrives on, without which one
      # from a libdispatch worker dies in ecl_process_env(); and structures by
      # value through SI:CALL-CFUN.  Those are what let the ECL backend do
      # without a pool of trampolines built before an app ships.
      #
      # This used to clone upstream and apply ci/ecl-rtld-default.patch here;
      # a committed fix is the better shape, because a revision alone then
      # settles what was built.  The patch file stays as the thing to send
      # upstream, and the build step below asserts the revision still carries
      # it.
      #
      # Delete this whole job the day the fixes are upstream and
      # `brew install ecl` carries them.
      # ---------------------------------------------------------------
      - name: Cache the patched ECL
        id: ecl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/ecl
          key: ecl-${{ runner.os }}-${{ runner.arch }}-${{ env.ECL_REVISION }}

      - name: Build ECL from source, patched
        if: steps.ecl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install gmp libffi automake autoconf libtool texinfo
          git clone "$ECL_REPOSITORY" "$RUNNER_TEMP/ecl"
          cd "$RUNNER_TEMP/ecl"
          git checkout "$ECL_REVISION"

          # The fix is in the revision, so nothing is applied here.  What is
          # left to check is that ci/ecl-rtld-default.patch -- which is both the
          # in-tree explanation and the patch to send upstream -- still
          # describes what was actually built.  It reverse-applies cleanly to a
          # tree that already has the fix, so that is the assertion.
          if git apply --check --reverse "$GITHUB_WORKSPACE/ci/ecl-rtld-default.patch" 2>/dev/null; then
            echo "$ECL_REVISION carries the fix, and it matches ci/ecl-rtld-default.patch"
          elif git apply --check "$GITHUB_WORKSPACE/ci/ecl-rtld-default.patch" 2>/dev/null; then
            echo "$ECL_REVISION does NOT carry the RTLD_DEFAULT fix -- wrong revision?" >&2
            exit 1
          else
            echo "ci/ecl-rtld-default.patch no longer describes $ECL_REVISION." >&2
            echo "Either upstream reworked that code, or the two have drifted." >&2
            exit 1
          fi

          ./configure --prefix="$HOME/.local/ecl" --enable-gmp=included
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Put ECL on the path
        run: echo "$HOME/.local/ecl/bin" >> "$GITHUB_PATH"

      # ocicl's installer is an SBCL program, but what it produces is a
      # directory of source and ocicl-runtime.lisp is implementation-agnostic.
      # So it is installed with SBCL and used from ECL.
      - name: Install SBCL, for ocicl only
        run: brew install sbcl

      - name: Install and configure ocicl
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        # ocicl exits 0 when a download fails.  Left alone, that surfaces two
        # steps later as "Component :ALEXANDRIA not found", pointing at the
        # library rather than at the registry that was unreachable.  So the
        # step fails here, on the line that says which package did not arrive.
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ocicl setup
          ocicl install 2>&1 | tee ocicl-install.log
          if grep -q "failed to install" ocicl-install.log; then
            echo "::error::ocicl could not install every dependency; see above" >&2
            exit 1
          fi

      - name: Report the environment the tests will see
        # The first line is the one that matters: if :default resolves nothing,
        # every later failure is a consequence of that and not worth reading.
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) (list :tree (merge-pathnames "ocicl/" (uiop:getcwd))) :inherit-configuration))' \
            --eval '(format t "~&:default resolves strlen: ~A~%" (and (ignore-errors (si:find-foreign-symbol "strlen" :default :pointer-void 0)) t))' \
            --eval '(asdf:load-system :objc)' \
            --eval '(objc:ensure-objc-initialized)' \
            --eval '(format t "ECL ~A on ~A~%BOOL encodes as: ~C~%compiled trampolines: ~A~%window server: ~A~%" (lisp-implementation-version) (machine-type) objc::*bool-encoding-char* (objc::compiled-trampolines-available-p) (objc.runloop:window-server-p))' \
            --eval '(ext:quit)'

      - name: Check the manual's examples still run
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) (list :tree (merge-pathnames "ocicl/" (uiop:getcwd))) :inherit-configuration))' \
            --eval '(asdf:load-system :objc/examples)' \
            --eval '(ext:quit (if (objc/examples:run-manual-examples) 0 1))'

      - name: Run tests
        # RUN-TESTS returns the status and ASDF discards what a TEST-OP returns,
        # so the exit code comes from here rather than from FIVEAM:RUN!, which
        # is how a CI run goes green on a failing suite.
        run: |
          ecl --norc \
            --eval '(require :asdf)' \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) (list :tree (merge-pathnames "ocicl/" (uiop:getcwd))) :inherit-configuration))' \
            --eval '(asdf:load-system :objc/test)' \
            --eval '(ext:quit (if (objc/test:run-tests) 0 1))'
