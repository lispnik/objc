# macOS is the only platform workflow here, because this library is macOS-only
# by construction: it binds /usr/lib/libobjc.A.dylib and Cocoa.  It runs on both
# architectures, in one workflow so that the single badge means "both pass".
#
# The Intel leg is not box-ticking.  The two architectures genuinely differ in
# the Objective-C ABI: BOOL encodes as 'c' (a signed char) on x86-64 and 'B'
# (C99 _Bool) on arm64, and -- the one most likely to break -- a large struct
# return goes through objc_msgSend_stret on x86-64, a function that does not
# exist on arm64, where the same call comes back through x8 from plain
# objc_msgSend.  Nothing here is conditionalised on architecture and BOOL's
# encoding is measured from the runtime rather than assumed, but "should work"
# and "does work" are different claims and only this makes the second one.
#
# What a CI run can and cannot prove.  GitHub's macOS runners have no window
# server, so [NSScreen mainScreen] is nil and the gui suite skips itself --
# roughly 30 of the checks.  Everything else runs, including the suites that
# matter most for portability of the dispatch machinery: the encoding parser,
# the struct layout table checked against Foundation's own
# NSGetSizeAndAlignment, the differential tests against the recorded LispWorks
# answers, and the dump suite, which saves an executable in a subprocess and
# sends a message to a Lisp-defined class after the restart.
#
# The skip count is printed by the suite.  A green headless run is a green run
# of fewer checks, not a green run of the GUI tests.

# The Intel leg is not box-ticking.  The two architectures genuinely differ in
# the Objective-C ABI: BOOL encodes as 'c' (a signed char) on x86-64 and 'B'
# (C99 _Bool) on arm64, and -- the one most likely to break -- a structure
# result over 16 bytes goes through objc_msgSend_stret on x86-64, a function
# that does not exist on arm64, where the same result comes back through x8.
# Nothing here is conditionalised on architecture: BOOL's encoding is read from
# the runtime, and the _stret decision is made by whether that symbol resolves
# in libobjc.  Those are reasons to expect Intel to work, not evidence that it
# does, and only this leg makes the second claim.
#
# The label matters.  macos-13, the old free Intel image, has been retired, and
# a job labelled with it is never assigned a runner -- it queues indefinitely
# rather than failing, so the workflow never reports at all.  Intel is now
# macos-15-intel / macos-26-intel (also spelled macos-*-large).
#
name: macOS

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: sbcl · ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-26-intel
            arch: x86-64

    steps:
      - uses: actions/checkout@v5

      - name: Install SBCL
        run: brew install sbcl

      - name: Install and configure ocicl
        run: |
          # Clone the ocicl *tool* outside the repo so it does not collide with
          # this project's gitignored ocicl/ dependency directory.
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ocicl setup
          ocicl install

      - name: Report the environment the tests will see
        # Worth its own step: BOOL's encoding is measured from the runtime
        # rather than chosen by a read-time conditional, and whether the gui
        # suite runs at all depends on there being a window server.  When
        # checks are skipped, this is what says why.
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :objc)' \
            --eval '(objc:ensure-objc-initialized)' \
            --eval '(format t "~&machine: ~A~%BOOL encodes as: ~C~%window server: ~A~%" (machine-type) objc::*bool-encoding-char* (objc.runloop:window-server-p))'

      - name: Check the manual's examples still run
        # examples/manual.lisp is a near-verbatim port of the file LispWorks
        # ships; every objc: form in it is unchanged from the original.  It
        # needs no window server, so it runs here.
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :objc/examples)' \
            --eval '(uiop:quit (if (objc/examples:run-manual-examples) 0 1))'

      - name: Run tests
        # RUN-TESTS returns the status; FIVEAM:RUN! alone would exit 0 on a
        # failing suite, which is how a CI run goes green on red tests.
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :objc/test)' \
            --eval '(uiop:quit (if (objc/test:run-tests) 0 1))'
